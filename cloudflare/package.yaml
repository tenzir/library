id: cloudflare
name: Cloudflare
version: "0.1.0"
author: Tenzir
author_icon: https://raw.githubusercontent.com/tenzir/library/main/.tenzir.svg
package_icon: |
  https://raw.githubusercontent.com/tenzir/library/main/cloudflare/package.svg
description: |
  [Cloudflare](https://www.cloudflare.com/) is a connectivity cloud whose
  reverse proxy, CDN, and web application firewall sit in front of websites
  and APIs. This package maps Cloudflare
  [Logpush](https://developers.cloudflare.com/logs/logpush/) data to OCSF
  1.9.0 and fetches account audit logs from the Cloudflare API.

  | Logpush dataset   | OCSF class           |
  | ----------------- | -------------------- |
  | `http_requests`   | HTTP Activity (4002) |
  | `firewall_events` | HTTP Activity (4002) |
  | `audit_logs_v2`   | API Activity (6003)  |

  Records of other datasets become OCSF Base Events.

  Normalize the records that a Logpush job writes to an S3 or R2 bucket:

  ```tql
  from_file "s3://example-logpush/http_requests/**/*.log.gz", watch=1min {
    decompress_gzip
    read_ndjson
  }
  cloudflare::ocsf::normalize
  ```

  Fetch account audit logs from the API:

  ```tql
  cloudflare::audit_logs::fetch "023e105f4ecef8ad9ca31a8372d0c353",
    api_token=secret("CLOUDFLARE_API_TOKEN"),
    since=now() - 1d
  cloudflare::ocsf::normalize
  ```

  The mapping reads Logpush's default timestamp formats, `unixnano` and
  `rfc3339`, but not `unix`. Both HTTP datasets share the Ray ID in `metadata.correlation_uid`, and
  firewall events repeat a request once per matched rule, so count requests
  on `metadata.log_name == "http_requests"`.
categories:
- sources
- mappings
