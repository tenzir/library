created: 2026-11-27
title: Older PAN-OS Traffic layouts and repeat counts
intro: >-
  Traffic records from PAN-OS versions before 11.1 parse without warnings. The OCSF
  mapping also carries the PAN-OS repeat count, no longer treats session ID 0 as a
  connection, and leaves empty fields out of `unmapped`.
