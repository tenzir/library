created: 2026-11-20
title: Exact PAN-OS parsing and OCSF classes for more PAN-OS logs
intro: >-
  The Palo Alto Networks package now parses PAN-OS records exactly as the firewall
  writes them, across more PAN-OS versions, layouts, and time zones. Its OCSF mappings
  normalize actions, outcomes, and identities consistently and map six more kinds
  of PAN-OS records to OCSF classes.
