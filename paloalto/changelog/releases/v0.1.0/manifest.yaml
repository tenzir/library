created: 2026-11-20
title: Exact PAN-OS parsing and OCSF classes for more PAN-OS logs
intro: >-
  The Palo Alto Networks package now keeps PAN-OS columns exactly as the firewall
  writes them, recognizes the layouts of more PAN-OS versions and log types, and interprets
  times in the firewall's time zone. Its OCSF mappings normalize actions, outcomes,
  files, URLs, and identities consistently, and they map Authentication, GlobalProtect,
  Config, Data Filtering, Decryption, and Correlated Events records to OCSF classes
  instead of Base Event.
