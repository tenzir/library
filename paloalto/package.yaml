description: |
  Parse Palo Alto Networks PAN-OS syslog CSV payloads and normalize Traffic,
  URL Filtering, Threat, and GlobalProtect authentication records to OCSF 1.9.
  Other PAN-OS record families become OCSF Base Events without losing their
  structured source fields.
