id: jev
name: Jev
author: Tenzir
description: |
  Query Jev and compatible System One APIs, including local Laya.
  Ask security questions about raw logs and OCSF events.
  Use `jev::noul`, `jev::choice`, or `jev::score` for a single question.
  `jev::ask` sends a record of typed questions in one request and adds the
  `answers` record and an `answer_list` of answers with question IDs to the event.
categories: []
