created: 2026-11-18
title: Header-aware Zeek SMTP classification
intro: >-
  This release maps Zeek SMTP records without message header addresses, such as rejected
  envelopes, to OCSF Network Activity instead of incomplete Email Activity events.
  All SMTP records now carry a status from the server's last reply.
