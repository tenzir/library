created: 2026-11-18
title: Valid Zeek SMTP and TLS events
intro: >-
  This release makes Zeek SMTP records with a rejected or unfinished envelope valid
  OCSF Email Activity events, whose sender and recipients fall back to the SMTP envelope
  when the message headers are missing. All SMTP records now carry a status from the
  server's last reply, and Email Activity events replace the deprecated `smtp_from`,
  `smtp_to`, `reply_to`, and `smtp_hello` attributes with their successors. Zeek TLS
  records without a finished handshake no longer carry an invalid TLS object, and
  all TLS records now expose their JA3 and JA3S fingerprints and server name on the
  endpoints. Zeek events no longer set `metadata.original_event_uid`; the connection
  UID remains in `metadata.correlation_uid`.
source:
