created: 2026-11-18
title: Valid Zeek SMTP, TLS, and HTTP events
intro: >-
  This release makes Zeek SMTP records with a rejected or unfinished envelope valid
  OCSF Email Activity events with a status from the server's last reply, and maps
  TLS fingerprints and server names to the endpoints. HTTP Activity events gain proxy
  headers, X-Forwarded-For addresses, and complete URLs with the Host header port.
  Zeek events now keep the connection UID only in `metadata.correlation_uid`.
source:
