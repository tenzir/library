created: 2026-11-18
title: Valid Zeek SMTP and TLS events
intro: >-
  This release makes Zeek SMTP records with a rejected or unfinished envelope valid
  OCSF Email Activity events, whose sender and recipients fall back to the SMTP envelope
  when the message headers are missing. All SMTP records now carry a status from the
  server's last reply. Zeek TLS records without a finished handshake no longer carry
  an invalid TLS object, and all TLS records now expose their JA3 and JA3S fingerprints
  and server name on the endpoints.
source:
