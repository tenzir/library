created: 2026-11-17
title: Accurate Zeek OCSF semantics
intro: >-
  This release corrects how the Zeek package maps SMTP, SMB, HTTP, FTP, DNS, TLS,
  and RDP fields to OCSF 1.9.0, keeps observed facts when native JSON omits optional
  fields, and records standalone certificates as Base Events.
