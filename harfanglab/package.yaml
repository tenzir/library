description: |
  [HarfangLab](https://harfanglab.io/) is a European endpoint detection and
  response (EDR) platform. This package collects its events and keeps its IOCs
  in sync with Tenzir.

  To collect events, enable the Splunk (OCSF) or Elastic (ECS) export in pull
  mode in the HarfangLab Manager and create an API token for a user that may
  pull them. `harfanglab::fetch` then pulls the events over the API, as OCSF
  events or ECS documents.

  The reduction operators cut the volume for a SIEM: they summarize network
  and HTTP activity and deduplicate process starts and module loads, and pass
  everything else through unchanged.

  `harfanglab::ioc::sync` keeps a HarfangLab IOC source in sync with a feed of
  indicators, so the agents alert on them.
categories:
