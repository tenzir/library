package_icon: |
  https://raw.githubusercontent.com/tenzir/library/main/harfanglab/package.svg
description: |
  [HarfangLab](https://harfanglab.io/) is a European endpoint detection and
  response (EDR) platform. Its Manager collects telemetry and alerts from the
  agents on Windows, Linux, and macOS endpoints.

  This package pulls events from a HarfangLab Manager through its pull
  exports, either as OCSF events or as ECS documents. The events arrive as the
  Manager exports them, without further mapping.
categories:
