id: otel
name: OpenTelemetry
author: Tenzir
author_icon: https://raw.githubusercontent.com/tenzir/library/main/.tenzir.svg
package_icon: |
  https://raw.githubusercontent.com/tenzir/library/main/otel/package.svg
description: |
  This package contains examples and operators for working with OpenTelemetry
  Protocol (OTLP) data.

  It receives native OTLP events, converts records to OTLP `KeyValue[]`, and
  builds OTLP `LogRecord` values. Compatibility operators can decode legacy
  OTLP/JSON export envelopes. Product-specific telemetry normalization belongs
  to the corresponding vendor package.
categories:
- mappings
