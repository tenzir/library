id: checkpoint
name: Check Point
version: "0.2.0"
author: Tenzir
author_icon: https://raw.githubusercontent.com/tenzir/library/main/.tenzir.svg
package_icon: https://raw.githubusercontent.com/tenzir/library/main/checkpoint/package.svg

description: |
  Parse Check Point Log Exporter records from syslog (structured data,
  RFC 5424 key=value, and pipe-delimited) and JSON exports, and normalize
  Quantum gateway and Security Management records to OCSF 1.9: firewall
  traffic, URL, threat, DLP, and email records, logins and logouts,
  Management API and SmartConsole operations, and IKE key installation.
  Harmony Endpoint events exported through Log Exporter and Harmony Email &
  Collaboration security events (events API and SIEM JSON) map to OCSF
  findings and activities too. Other records become OCSF Base Events
  without losing their fields.
categories:
- mappings
- sources

