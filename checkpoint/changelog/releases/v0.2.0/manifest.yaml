title: More Check Point fields mapped to OCSF
intro: >-
  This release maps more Check Point fields to OCSF, including remote access VPN client
  details, Identity Awareness groups, TCP flags, and security zones. It also cleans
  up key and user name parsing and stops deriving values that the source doesn't state.
