created: 2026-11-23
title: Check Point parsing and OCSF mappings for gateway, management, and Harmony
  logs
intro: >-
  The Check Point package parses Log Exporter records from syslog and JSON exports
  exactly as the gateway writes them and maps gateway and management records to OCSF
  1.9, from firewall traffic with its byte counters to logins, management operations,
  and threat findings. It also maps Harmony Endpoint and Harmony Email & Collaboration
  events.
