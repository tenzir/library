id: slack
name: Send to Slack
author: Tenzir
author_icon: https://raw.githubusercontent.com/tenzir/library/main/.tenzir.svg
package_icon: https://raw.githubusercontent.com/tenzir/library/main/slack/package.svg

description: |
  Send events from a pipeline to a [Slack](https://slack.com) channel through an
  incoming webhook, for real-time alerts and notifications such as detections or
  aggregated metrics. Use `slack::send` for plain messages and `slack::alert`
  for structured alerts.
categories:
- destinations
