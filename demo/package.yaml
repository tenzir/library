id: demo
name: Demo
author: Tenzir
author_icon: https://raw.githubusercontent.com/tenzir/library/main/.tenzir.svg
package_icon: https://raw.githubusercontent.com/tenzir/library/main/demo/package.svg

description: |
  This package provides live Zeek, Suricata, and OpenSSH event feeds for demo
  purposes. It generates synthetic network security events based on realistic
  patterns, including DNS queries, HTTP traffic, SSL connections, potential
  security alerts, and SSH authentication activity captured from six Linux
  distributions. The generated data is ideal for testing pipelines, developing
  detections, and demonstrating Tenzir's capabilities without requiring actual
  network traffic or production data.
