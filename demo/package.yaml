author: Tenzir
author_icon: https://raw.githubusercontent.com/tenzir/library/main/.tenzir.svg
package_icon: https://raw.githubusercontent.com/tenzir/library/main/demo/package.svg

description: |
  This package provides live Zeek, Suricata, OpenSSH, and Windows event feeds
  for demo purposes, plus continuous replays of Claude Code and Codex telemetry
  with invented content. The feeds replay recordings as endless live streams
  with current timestamps and fresh identifiers: 20 minutes of invented office
  traffic as Zeek and Suricata saw it, SSH authentication activity captured from
  six Linux distributions, and raw Windows events from a test-lab capture in
  Winlogbeat, Fluent Bit, and Windows Event Log XML representations. The data is
  ideal for testing pipelines, developing detections, and demonstrating Tenzir's
  capabilities without requiring actual network traffic or production data.
