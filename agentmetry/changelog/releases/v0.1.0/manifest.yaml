created: 2026-11-13
title: Agentmetry tool calls and detections in OCSF
intro: >-
  The new Agentmetry package maps the tool calls, approvals, and detections that Agentmetry
  records for AI coding agents to OCSF 1.9.0. Tool calls from Claude Code also carry
  the harness's tool-use ID and its reported status and duration, and detection findings
  show the tool calls that triggered them as evidence.
