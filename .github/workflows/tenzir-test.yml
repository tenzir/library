name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changelogs:
    name: Validate package releases
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
          python-version: "3.13"

      - name: Test release automation
        run: python3 -m unittest discover -s .github/scripts/tests -v

      - name: Validate package changelogs
        shell: bash
        run: |
          for manifest in */package.yaml; do
            package="${manifest%/package.yaml}"
            if [[ -d "$package/changelog" ]]; then
              uvx tenzir-ship==2.3.1 --root "$package" validate
            fi
          done

      - name: Check release history and tag conflicts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          python3 .github/scripts/package-release-tags.py
          --base "${BASE_SHA:-HEAD}" --head "$GITHUB_SHA"

  tql-syntax:
    name: Validate TQL syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
          python-version: "3.13"

      - name: Parse TQL files
        env:
          TENZIR_BINARY: uvx tenzir
        shell: bash
        run: ./.github/scripts/check-tql-syntax.sh

  tenzir-test:
    name: Test packages (${{ matrix.tenzir.channel }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.tenzir.experimental }}
    strategy:
      fail-fast: false
      matrix:
        tenzir:
          - channel: latest-release
            experimental: false
            binary: uvx tenzir
            node_binary: uvx --from tenzir tenzir-node
          - channel: latest-prerelease
            experimental: false
            binary: uvx --prerelease allow tenzir
            node_binary: uvx --prerelease allow --from tenzir tenzir-node
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
          python-version: "3.13"

      - name: Detect touched packages
        id: touched
        shell: bash
        run: |
          packages=$(./.github/scripts/detect-touched-packages.sh "${{ github.event.pull_request.base.sha || '' }}")
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

      - name: Run package tests
        if: steps.touched.outputs.packages != ''
        env:
          TENZIR_BINARY: ${{ matrix.tenzir.binary }}
          TENZIR_NODE_BINARY: ${{ matrix.tenzir.node_binary }}
        shell: bash
        run: |
          packages="${{ steps.touched.outputs.packages }}"
          # Select package projects so their fixtures and hooks are loaded.
          # A root-project --match filter only selects files, not their project.
          if [[ "$packages" == "." ]]; then
            package_dirs=()
            for manifest in */package.yaml; do
              package_dirs+=("${manifest%/package.yaml}")
            done
          else
            read -r -a package_dirs <<< "$packages"
          fi
          uvx tenzir-test "${package_dirs[@]}"

  release-tags:
    name: Tag package releases
    needs: [changelogs, tql-syntax, tenzir-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Configure tag author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Tag new package releases
        env:
          BASE_SHA: ${{ github.event.before }}
        run: >-
          python3 .github/scripts/package-release-tags.py
          --base "$BASE_SHA" --head "$GITHUB_SHA" --publish
