name: Tests

on:
  workflow_dispatch:
    inputs:
      release-base:
        description: >-
          Commit on main before the releases to tag. Leave empty to run checks
          only.
        required: false
        default: ""
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changelogs:
    name: Validate package releases
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
          python-version: "3.13"

      - name: Validate package changelogs
        shell: bash
        run: |
          for manifest in */package.yaml; do
            package="${manifest%/package.yaml}"
            if [[ -d "$package/changelog" ]]; then
              uvx tenzir-ship --root "$package" validate
            fi
          done

      - name: Check release history and tag conflicts
        env:
          PUSH_BASE: ${{ github.event.before }}
          RELEASE_BASE: ${{ inputs.release-base }}
        shell: bash
        run: |
          case "$GITHUB_EVENT_NAME" in
            # The merge commit's first parent is the base the PR was tested on.
            pull_request) base="$GITHUB_SHA^1" ;;
            push) base="$PUSH_BASE" ;;
            *) base="${RELEASE_BASE:-HEAD}" ;;
          esac
          python3 .github/scripts/package-release-tags.py \
            --base "$base" --head "$GITHUB_SHA"

  tql-syntax:
    name: Validate TQL syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
          python-version: "3.13"

      - name: Parse TQL files
        env:
          TENZIR_BINARY: uvx tenzir
        shell: bash
        run: ./.github/scripts/check-tql-syntax.sh

  tenzir-test:
    name: Test packages (${{ matrix.tenzir.channel }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.tenzir.experimental }}
    strategy:
      fail-fast: false
      matrix:
        tenzir:
          - channel: latest-release
            experimental: false
            binary: uvx tenzir
          - channel: latest-prerelease
            experimental: false
            binary: uvx --prerelease allow tenzir
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
          python-version: "3.13"

      - name: Detect touched packages
        id: touched
        shell: bash
        run: |
          packages=$(./.github/scripts/detect-touched-packages.sh "${{ github.event.pull_request.base.sha || '' }}")
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

      - name: Run package tests
        if: steps.touched.outputs.packages != ''
        env:
          TENZIR_BINARY: ${{ matrix.tenzir.binary }}
        shell: bash
        run: |
          packages="${{ steps.touched.outputs.packages }}"
          # Select package projects so their fixtures and hooks are loaded.
          # A root-project --match filter only selects files, not their project.
          if [[ "$packages" == "." ]]; then
            package_dirs=()
            for manifest in */package.yaml; do
              package_dirs+=("${manifest%/package.yaml}")
            done
          else
            read -r -a package_dirs <<< "$packages"
          fi
          uvx tenzir-test "${package_dirs[@]}"

  release-tags:
    name: Tag package releases
    needs: [changelogs, tql-syntax, tenzir-test]
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.release-base != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Configure tag author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Tag new package releases
        id: tag
        env:
          BASE_SHA: ${{ inputs.release-base || github.event.before }}
        shell: bash
        run: |
          python3 .github/scripts/package-release-tags.py \
            --base "$BASE_SHA" --head "$GITHUB_SHA" --publish \
            | tee release-tags.log
          if grep -q '^Release tag: ' release-tags.log; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate app token
        id: app-token
        if: steps.tag.outputs.released == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.TENZIR_GITHUB_APP_ID }}
          private-key: ${{ secrets.TENZIR_GITHUB_APP_PRIVATE_KEY }}
          owner: tenzir
          repositories: content
          permission-contents: write

      - name: Dispatch website rebuild
        if: steps.tag.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          gh api repos/tenzir/content/dispatches \
            --method POST \
            --input - <<EOF
          {
            "event_type": "library-updated",
            "client_payload": {
              "repository": "${SOURCE_REPOSITORY}",
              "ref": "${SOURCE_REF}",
              "sha": "${SOURCE_SHA}",
              "run_id": "${SOURCE_RUN_ID}"
            }
          }
          EOF
