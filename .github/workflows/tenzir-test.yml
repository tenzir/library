name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  tql-syntax:
    name: Validate TQL syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
          python-version: "3.13"

      - name: Parse TQL files
        env:
          TENZIR_BINARY: uvx --from tenzir==6.20.0 tenzir --nova
        shell: bash
        run: ./.github/scripts/check-tql-syntax.sh

  tenzir-test:
    name: Test packages (${{ matrix.tenzir.channel }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.tenzir.experimental }}
    strategy:
      fail-fast: false
      matrix:
        tenzir:
          - channel: nova-6.20.0
            experimental: false
            binary: uvx --from tenzir==6.20.0 tenzir --nova
            node_binary: uvx --from tenzir==6.20.0 tenzir-node --nova
          - channel: latest-prerelease
            experimental: false
            binary: uvx --prerelease allow tenzir --nova
            node_binary: uvx --prerelease allow --from tenzir tenzir-node --nova
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
          python-version: "3.13"

      - name: Detect touched packages
        id: touched
        shell: bash
        run: |
          packages=$(./.github/scripts/detect-touched-packages.sh "${{ github.event.pull_request.base.sha || '' }}")
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

      - name: Run package tests
        if: steps.touched.outputs.packages != ''
        env:
          TENZIR_BINARY: ${{ matrix.tenzir.binary }}
          TENZIR_NODE_BINARY: ${{ matrix.tenzir.node_binary }}
        shell: bash
        run: |
          packages="${{ steps.touched.outputs.packages }}"
          # Select package projects so their fixtures and hooks are loaded.
          # A root-project --match filter only selects files, not their project.
          if [[ "$packages" == "." ]]; then
            package_dirs=()
            for manifest in */package.yaml; do
              package_dirs+=("${manifest%/package.yaml}")
            done
          else
            read -r -a package_dirs <<< "$packages"
          fi
          uvx tenzir-test "${package_dirs[@]}"
