id: socprime
name: SOC Prime
author: Tenzir
author_icon: https://raw.githubusercontent.com/tenzir/library/main/.tenzir.svg
categories:
- mappings
- contexts
description: |
  [SOC Prime](https://socprime.com) curates Sigma detection content for the
  latest threats. This package bundles a snapshot of the content that SOC
  Prime ships with [DetectFlow](https://github.com/socprime/detectflow-backend):
  behavior rules, High-Order Sigma (HoS) rules that chain behavior rules into
  attack chains, and the Active Threats that they cover.

  Use `socprime::detect` to match OCSF events against all behavior rules.
  `socprime::hos::detect` runs the attack chain of a HoS rule in a single
  pipeline: it matches the stage rules and correlates their findings per host.
  Both emit OCSF Detection Findings. `socprime::hos::list` shows the available
  HoS rules.

  The chain building blocks also work for your own detections:
  `socprime::correlate` correlates stage records from any source, such as Sigma
  findings, raw events, or aggregates, and `socprime::ocsf::finding` models the
  chains as Detection Findings. `socprime::native::php2shell` shows a
  TQL-native chain that follows the exploited process instead of the host.

  `socprime::enrich` attaches the matching Active Threats as OCSF `osint`
  objects to the findings. It reads a lookup table keyed by Sigma rule ID,
  which `socprime::update_context` fills from the bundled threats. Declare the
  lookup table in your configuration:

  ```yaml
  # contexts/socprime-active-threats.yaml
  type: lookup-table
  ```
