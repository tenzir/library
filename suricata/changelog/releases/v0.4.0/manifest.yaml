created: 2026-11-18
title: Evidence-based OCSF classes for Suricata
intro: >-
  This release maps Suricata file, Kerberos, and SMTP events to the OCSF classes that
  their observed evidence supports, so they no longer require actors or users that
  the sensor never saw. SMTP events without parsed message headers become valid Email
  Activity events whose sender and recipients come from the SMTP envelope. TLS events
  now expose their JA3 and JA3S fingerprints and server name on the endpoints.
source:
