created: 2026-11-18
title: Evidence-based OCSF classes for Suricata
intro: >-
  This release maps Suricata file, Kerberos, and SMTP events to the OCSF classes that
  their observed evidence supports, so they no longer require actors, users, or email
  header addresses that the sensor never saw.
