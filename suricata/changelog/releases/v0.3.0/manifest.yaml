created: 2026-11-17
title: Accurate Suricata OCSF semantics
intro: >-
  This release corrects how the Suricata package maps DNS, SMB, SMTP, Kerberos, FTP,
  HTTP, TLS, MQTT, and flow events to OCSF 1.9.0, including events that read_suricata
  parses with null-filled schemas.
