id: splunk
name: Splunk
author: Tenzir
author_icon: https://raw.githubusercontent.com/tenzir/library/main/.tenzir.svg
package_icon: https://raw.githubusercontent.com/tenzir/library/main/splunk/package.svg
description: |
  This package maps between [Splunk](https://www.splunk.com) Common Information
  Model (CIM) field shapes and Open Cybersecurity Schema Framework (OCSF)
  events.

  Use `splunk::cim::from_ocsf` to transform supported OCSF 1.9 event classes into
  Splunk CIM datasets, and `splunk::ocsf::from_cim` to transform supported Splunk
  CIM datasets back into OCSF. These compatibility operators help reuse
  detection logic, analytics, and routing pipelines across systems that expect
  either schema.

  `splunk::cim::from_ocsf` accepts OCSF with or without captions. It produces
  the CIM record only, so bind Splunk metadata, such as the host, source, and
  time, from the OCSF event when you send the record with `to_splunk`.
categories:
- destinations
- mappings
