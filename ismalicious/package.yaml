name: IsMalicious
author: IsMalicious
description: |
  [IsMalicious](https://ismalicious.com) provides indicator reputation with risk,
  evidence and provenance for IP addresses, domains, URLs and file hashes.

  Query the API using your own account credential. Results retain unknown hashes,
  contradictory evidence and source attributes; these operators do not make an
  automatic blocking decision or redistribute paid feeds.
