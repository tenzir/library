id: geo_open
name: Geo Open
version: "0.0.1"
author: Tenzir
author_icon: https://raw.githubusercontent.com/tenzir/library/main/.tenzir.svg
package_icon: https://raw.githubusercontent.com/tenzir/library/main/geo_open/package.svg

description: |
  Free IP geolocation using Geo Open MMDB databases from CIRCL, the Computer
  Incident Response Center Luxembourg. Geo Open provides daily snapshots of
  IP-to-country and IP-to-ASN mappings in MaxMind database format, offering a
  privacy-respecting alternative to commercial geolocation services.

  The examples enrich IP addresses with `context_enrich` from a GeoIP context
  named `geo-open`. Declare it in your configuration:

  ```yaml
  # contexts/geo-open.yaml
  type: geoip
  url: https://cra.circl.lu/opendata/geo-open/mmdb-country-asn/latest.mmdb
  reload-interval: 1d
  persist: true
  ```

  The context downloads the database after the deploy and checks for a newer
  one daily. For country data only, use the `mmdb-country` variant.

categories:
  - contexts
