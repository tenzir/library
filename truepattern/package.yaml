id: truepattern
name: TruePattern
author: TruePattern
description: |
  [TruePattern](https://truepattern.io) publishes curated detection rules in
  Sigma, Splunk, KQL, YARA, Sublime Security, and other formats as a STIX 2.1
  feed over TAXII. Use `truepattern::feed` to fetch the rules,
  `truepattern::sigma::update_rules` to keep a Sigma rule file current for the
  `sigma` operator, and `truepattern::enrich` to attach rule metadata, such as
  license and upstream source, to the resulting detection findings.
categories:
- sources
- mappings
- contexts

contexts:
  truepattern-sigma-rules:
    type: lookup-table
    description: TruePattern rule metadata keyed by Sigma rule ID.
    args: {}
