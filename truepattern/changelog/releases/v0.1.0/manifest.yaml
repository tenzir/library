created: 2026-11-15
title: Per-rule OCSF coverage reports
intro: >-
  The new coverage report shows how the `sigma` operator of your Tenzir build treats
  every TruePattern Sigma rule on OCSF input. It asks the engine which rules it translates,
  skips, or rejects, names the fields that block a translation, and keeps the upstream
  source reference of each rule.
