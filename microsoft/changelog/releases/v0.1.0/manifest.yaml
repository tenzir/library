created: 2026-11-15
title: Unified Windows normalization for OCSF and stock Sigma rules
intro: >-
  The Microsoft package now normalizes Windows Event Log events from Windows hosts,
  Fluent Bit, NXLog, and Winlogbeat to OCSF 1.9 with one provider-aware operator,
  and it absorbs the former `sysmon` package. The Windows mappings carry the events
  and fields that stock Sigma rules match on, so the `sigma` operator can run those
  rules on normalized events. New operators also collect and normalize Microsoft Graph
  telemetry and translate OCSF events to Microsoft Sentinel ASIM.
