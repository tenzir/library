created: 2026-11-19
title: Windows OCSF mappings checked against real events
intro: "This release maps Windows events the way real records write them and stops\
  \ building OCSF objects that the events can't fill.\n\n| Area | What changes |\n\
  |---|---|\n| Event data | Security event data carries rendered text instead of `%%`\
  \ tokens, unnamed event data is `param1`, `param2`, \u2026, and event data values\
  \ stay strings as Windows writes them, for all collectors. |\n| Class changes |\
  \ Service Control Manager and Sysmon state reports, application hangs, Windows Error\
  \ Reporting, and Event Log service starts and stops move to classes that their data\
  \ supports. |\n| Objects no longer built | Defender, Windows Firewall, and AppX\
  \ events no longer build `actor.process` without a process ID. Some Sigma rules\
  \ go silent or match more; the entries give replacements. |\n| Bug fixes | Application\
  \ crashes, App Control, AppX errors, Code Integrity, cleared logs, Defender evidence,\
  \ Security entity events and access masks, PowerShell, Sysmon modules, and Microsoft\
  \ Graph devices and risky users map more fields correctly. |\n| Removed operators\
  \ | `application_crash_report`, `eventlog_start`, and `eventlog_stop` are gone;\
  \ `microsoft::windows::ocsf::normalize` needs no change. |\n| Test data | The test\
  \ fixtures use synthetic records instead of records from public datasets. |"
