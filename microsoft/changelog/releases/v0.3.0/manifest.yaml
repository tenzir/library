created: 2026-11-19
title: Windows OCSF mappings checked against real events
intro: >-
  This release corrects how the Microsoft package maps Windows events whose test fixtures
  did not match real records, such as application crashes, Windows Error Reporting,
  Service Control Manager, App Control, Defender, and AppX events. Security events
  now carry the text of their message tokens, so Windows Event XML, Fluent Bit, and
  Winlogbeat produce the same events. The package also stops building OCSF objects
  that the events cannot fill: processes that Windows names without a process ID stay
  in unmapped, and Sysmon state changes and application hangs move to classes that
  their data supports. Three event mapping operators are gone, and some Sigma rules
  that read the affected fields no longer match; the entries name the replacements.
  Microsoft Graph devices now report their operating system type.
