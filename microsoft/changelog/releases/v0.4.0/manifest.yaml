created: 2026-11-22
title: Windows account events in OCSF User Management and NXLog events like native
  XML
intro: >-
  This release maps Windows account events to OCSF User Management, rebuilds NXLog
  events like native Windows XML, and names events by their title. Sigma rules on
  account events and on group members need a Tenzir version whose `sigma` operator
  reads User Management and `users`.
