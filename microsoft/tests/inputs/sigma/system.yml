# Stock-shaped Sigma rules for regression tests. Each rule uses the logsource,
# event IDs, and field names of the SigmaHQ rule in `related`, with synthetic
# values that match the fixtures in tests/inputs.
#
# Tenzir's catalog selects Windows Service Activity for the system service
# family. Service Control Manager state reports (7023, 7034, 7036) map to
# Application Lifecycle, so the 7023 rules below must not fire. Service
# installations (7045) remain Windows Service Activity.
title: Service terminated with an error
id: d344f10a-2ebe-5641-9b02-b2ad807fb1a7
related:
  - id: acfa2210-0d71-4eeb-b477-afab494d596c
    type: similar
status: test
logsource:
  product: windows
  service: system
detection:
  selection:
    Provider_Name: 'Service Control Manager'
    EventID: 7023
  condition: selection
level: medium
