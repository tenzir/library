id: ocsf_generate
name: OCSF workload generator
author: Tenzir
author_icon: https://raw.githubusercontent.com/tenzir/library/main/.tenzir.svg
description: |
  Generate synthetic OCSF 1.9 events for Base Event and 45 classes from a
  recurring organization of users, workstations, and services, for demos,
  lookup benchmarks, and robustness tests. Produce a finite dataset, historical
  office-hours traffic, or a continuous stream at a configurable rate, with
  native raw logs for common products, exact counts of IOC needles, and optional
  schema irregularities. A separate operator generates OCSF 1.6 events for five
  common classes.
categories:
- sources
