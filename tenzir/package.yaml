id: tenzir
name: Tenzir Utilities
version: "0.0.1"
author: Tenzir
author_icon: https://raw.githubusercontent.com/tenzir/library/main/.tenzir.svg
package_icon: https://raw.githubusercontent.com/tenzir/library/main/tenzir/package.svg

description: |
  Utility operators maintained by Tenzir for common event-processing tasks.

  This package provides helpers for enriching OCSF-shaped events with OSINT
  objects, trimming OCSF events for downstream storage or transport, detecting
  scan fan-out, beacon cadence, long connections, and outbound volume bursts in
  OCSF Network Activity streams, and learning per-entity behavioral baselines
  with mergeable statistical models to flag unfamiliar feature values.

  It also detects security-relevant AI agent activity normalized by the
  `anthropic` and `openai` packages: credential material exposed to an agent,
  sessions assigned a disallowed full-autonomy permission mode, hidden Unicode
  formatting characters used to smuggle instructions past human review, and
  hooks registered through a settings override rather than a committed
  project file.

  The OSINT operators and the baseline examples use lookup tables that you
  declare in your configuration, `contexts/ocsf-osint.yaml` and
  `contexts/process-name-baselines.yaml`:

  ```yaml
  type: lookup-table
  persist-interval: 5min
  ```

  Add `write-timeout: 30d` to the OSINT table so that indicators that feeds
  stop reporting age out.

categories:
- contexts
- mappings

